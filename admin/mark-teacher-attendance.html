<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI – Teacher Attendance</title>
  <link rel="icon" type="image/png" href="../logo2.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ================== components.css ================== */
    /* Consolidated CSS for all components (Header, Sidebar, Main Panel) */
    /* Used by: Dashboard, Student, Teacher, Admission, Academic Managers */

    :root {
      /* === BLUE THEME from index.css === */
      --ink: oklch(22% .035 300);
      --ink-soft: oklch(38% .03 300);
      --paper: oklch(97% .015 86);
      --surface: oklch(100% .008 86);
      --line: oklch(88% .025 86);
      --blue: oklch(48% .18 260);
      --blue-deep: oklch(32% .16 260);
      --blue-soft: oklch(82% .09 260);
      --gold: oklch(78% .15 85);
      --lime: oklch(82% .17 108);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'DM Sans', 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #f4f7fc;
      color: var(--ink);
    }

    /* ========== HEADER ========== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      z-index: 1000;
      border-bottom: 1px solid var(--line);
    }

    .top-bar-left, 
    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: #f8fafd;
      border: 1px solid var(--line);
      width: 42px;
      height: 42px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--blue);
      font-size: 20px;
      transition: all 0.2s var(--ease);
    }

    .icon-btn:hover {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    .school-logo {
      width: 42px;
      height: 42px;
      overflow: hidden;
    }

    .school-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .school-name {
      font-size: 21px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.2px;
    }

    .school-name-wrap {
      display: flex;
      align-items: center;
    }

    .datetime-display {
      background: #f8fafd;
      padding: 8px 16px;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 14.5px;
      border-radius: 4px;
    }

    .date-box, 
    .time-box {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .date-box i, 
    .time-box i {
      color: var(--blue);
      font-size: 16px;
    }

    .date-text, 
    .time-text {
      font-weight: 600;
      color: var(--ink-soft);
    }

    .time-text {
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    /* ========== HEADER DROPDOWN ========== */
    .header-dropdown {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      right: 0;
      top: 62px;
      background: white;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      width: 200px;
      overflow: hidden;
      border-radius: 4px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: all 0.2s var(--ease);
      z-index: 1100;
      border: 1px solid var(--line);
    }

    .dropdown-menu.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 14.8px;
      transition: all 0.2s var(--ease);
    }

    .dropdown-item:hover {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .dropdown-item i {
      width: 20px;
      color: var(--blue);
    }

    .dropdown-item:hover i {
      color: var(--blue);
    }

    /* ========== APP WRAPPER ========== */
    .app-wrapper {
      display: flex;
      margin-top: 70px;
      min-height: calc(100vh - 70px);
      transition: all 0.3s var(--ease);
    }

    /* ========== SIDEBAR ========== */
    .side-nav {
      width: 260px;
      background: white;
      border-right: 1px solid var(--line);
      padding: 20px 0;
      position: sticky;
      top: 70px;
      height: calc(100vh - 70px);
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.02);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-radius: 0;
      transition: width 0.3s var(--ease), transform 0.3s var(--ease);
    }

    .side-nav.hidden {
      width: 0;
      overflow: hidden;
      padding: 0;
      border-right: none;
    }

    .nav-menu {
      list-style: none;
      flex: 1;
    }

    .nav-divider {
      height: 2px;
      background: var(--blue);
      margin: 16px 20px;
      opacity: 0.3;
    }

    .section-header {
      padding: 0 22px 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-soft);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 22px;
      color: var(--ink);
      font-size: 14.8px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s var(--ease);
      border-left: 4px solid transparent;
      white-space: nowrap;
    }

    .nav-link:hover {
      background: var(--blue-soft);
      color: var(--blue-deep);
      border-left-color: var(--blue);
    }

    .nav-link.active,
    .dashboard-link {
      background: var(--blue-soft);
      color: var(--blue-deep);
      border-left-color: var(--blue);
    }

    .nav-link i {
      width: 22px;
      color: var(--blue);
      font-size: 18px;
      transition: color 0.2s var(--ease);
    }

    .nav-link:hover i,
    .nav-link.active i,
    .dashboard-link i {
      color: var(--blue-deep);
    }

    /* Hide text when sidebar is collapsed on desktop */
    .side-nav.hidden .nav-link span,
    .side-nav.hidden .section-header,
    .side-nav.hidden .nav-divider,
    .side-nav.hidden .sidebar-footer {
      display: none;
    }

    .side-nav.hidden .nav-link {
      padding: 13px 0;
      justify-content: center;
    }

    .side-nav.hidden .nav-link i {
      margin: 0;
      font-size: 20px;
    }

    /* ========== SIDEBAR DROPDOWNS ========== */
    .dropdown-nav {
      position: relative;
    }

    .dropdown-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      width: 100%;
      padding: 13px 22px;
      color: var(--ink);
      font-size: 14.8px;
      font-weight: 500;
      text-decoration: none;
      border-left: 4px solid transparent;
      gap: 14px;
      transition: all 0.2s var(--ease);
      background: transparent;
      border-right: none;
      border-top: none;
      border-bottom: none;
    }

    .dropdown-toggle:hover {
      background: var(--blue-soft);
      border-left-color: var(--blue);
      color: var(--blue-deep);
    }

    .dropdown-arrow {
      font-size: 12px;
      transition: transform 0.3s var(--ease);
      margin-left: auto;
      color: var(--blue);
      flex-shrink: 0;
    }

    .dropdown-nav.active .dropdown-arrow {
      transform: rotate(180deg);
    }

    .dropdown-menu-side {
      list-style: none;
      background: var(--blue-soft);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      margin-left: 24px;
      border-left: 2px solid var(--blue);
      opacity: 0.6;
    }

    .dropdown-nav.active .dropdown-menu-side {
      max-height: 400px;
      transition: max-height 0.5s ease-in;
    }

    .dropdown-item-side {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s var(--ease);
    }

    .dropdown-item-side:hover {
      background: var(--blue);
      color: white;
    }

    .dropdown-item-side i {
      width: 20px;
      font-size: 14px;
      color: var(--blue);
      transition: color 0.2s var(--ease);
    }

    .dropdown-item-side:hover i {
      color: white;
    }

    /* ========== SIDEBAR FOOTER ========== */
    .sidebar-footer {
      padding: 22px 24px;
      border-top: 1px solid var(--line);
      margin-top: auto;
    }

    .developed-by {
      font-size: 13.2px;
      color: var(--ink-soft);
      line-height: 1.6;
      text-align: center;
    }

    .developed-by .label {
      display: block;
      font-weight: 500;
      margin-bottom: 5px;
      color: var(--ink-soft);
      opacity: 0.7;
    }

    .developed-by .name {
      display: block;
      font-weight: 700;
      color: var(--blue);
    }

    /* ========== MAIN CONTENT PANEL ========== */
    .main-panel {
      flex: 1;
      padding: 40px 32px;
      background: var(--paper);
      overflow-y: auto;
      transition: margin-left 0.3s var(--ease);
    }

    .top-row {
      display: flex;
      gap: 28px;
      margin-bottom: 40px;
      align-items: stretch;
    }

    .welcome-section {
      flex: 1;
      background: white;
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .welcome-title {
      font-size: 27px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .welcome-title span {
      color: var(--blue);
    }

    .welcome-text {
      font-size: 15.8px;
      color: var(--ink-soft);
      line-height: 1.75;
      margin-bottom: 12px;
    }

    /* ========== PROFILE SIDEBAR ========== */
    .profile-sidebar {
      width: 260px;
      background: white;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      flex-shrink: 0;
    }

    .passport-frame {
      width: 158px;
      height: 198px;
      margin: 0 auto 18px;
      border: 4px solid var(--blue);
      border-radius: 4px;
      overflow: hidden;
    }

    .passport-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-size: 21px;
      font-weight: 700;
      color: var(--ink);
    }

    .profile-role {
      font-size: 14.5px;
      color: var(--ink-soft);
      margin-top: 4px;
      opacity: 0.8;
    }

    /* ========== UTILITY CLASSES ========== */
    button {
      border-radius: 4px;
    }

    /* Overlay for mobile sidebar */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 70px;
      left: 0;
      width: 100%;
      height: calc(100% - 70px);
      background: rgba(0, 0, 0, 0.5);
      z-index: 998;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s var(--ease);
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
      display: block;
    }

    /* Scrollbar styling */
    .side-nav::-webkit-scrollbar,
    .main-panel::-webkit-scrollbar {
      width: 6px;
    }

    .side-nav::-webkit-scrollbar-track,
    .main-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    .side-nav::-webkit-scrollbar-thumb,
    .main-panel::-webkit-scrollbar-thumb {
      background: var(--blue-soft);
      border-radius: 3px;
    }

    .side-nav::-webkit-scrollbar-thumb:hover,
    .main-panel::-webkit-scrollbar-thumb:hover {
      background: var(--blue);
    }

    /* ================== responsive-components.css ================== */
    /* Mobile & Tablet responsiveness for all components */
    /* Load this AFTER components.css */
    /* Breakpoints: 768px = mobile, 769-1024px = tablet, 1025px+ = desktop */

    /* ========== MOBILE (max-width: 768px) ========== */
    @media (max-width: 768px) {

      /* ----- HEADER ----- */
      .top-bar {
        padding: 0 12px;
      }

      .top-bar-left,
      .top-bar-right {
        gap: 10px;
      }

      #fullscreenToggle {
        display: none;
      }

      .datetime-display {
        display: none;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
        font-size: 17px;
        border-radius: 4px;
      }

      .icon-btn:hover {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }

      .school-logo {
        width: 36px;
        height: 36px;
      }

      /* School name: wraps into multiple lines on mobile */
      .school-name-wrap {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        height: auto;
      }

      .top-bar-left {
        flex: 1;
        min-width: 0;
        align-items: center;
      }

      /* Special language + fully bolded */
      .school-name {
        display: block;
        font-family: 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif;
        font-weight: 900;
        font-style: italic;
        letter-spacing: 0.5px;
        text-transform: capitalize;
        color: var(--blue-deep, #1e3a8a);
        text-shadow: 0 1px 1px rgba(30, 58, 138, 0.15);
        white-space: normal;
        overflow: hidden;
        text-overflow: unset;
        font-size: 13.5px;
        line-height: 1.25;
        max-width: 100%;
        word-wrap: break-word;
        overflow-wrap: break-word;
        position: static;
        animation: none;
      }

      /* ----- SIDEBAR ----- */
      .side-nav {
        position: fixed;
        top: 70px;
        left: 0;
        height: calc(100vh - 70px);
        width: 260px;
        z-index: 999;
        transform: translateX(-100%);
        transition: transform 0.3s var(--ease);
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.2);
      }

      .side-nav.hidden {
        transform: translateX(-100%);
        width: 260px;
        padding: 20px 0;
      }

      .side-nav.mobile-visible {
        transform: translateX(0);
      }

      /* Hide elements when sidebar collapsed in text for mobile */
      .side-nav.hidden .nav-link span,
      .side-nav.hidden .section-header,
      .side-nav.hidden .nav-divider,
      .side-nav.hidden .sidebar-footer {
        display: block;
      }

      .side-nav.hidden .nav-link {
        padding: 13px 22px;
        justify-content: flex-start;
      }

      .side-nav.hidden .nav-link i {
        margin: 0;
        font-size: inherit;
      }

      .nav-link:hover {
        background: var(--blue-soft);
        color: var(--blue-deep);
        border-left-color: var(--blue);
      }

      .nav-link i {
        color: var(--blue);
      }

      .nav-link:hover i {
        color: var(--blue-deep);
      }

      .dropdown-toggle:hover {
        background: var(--blue-soft);
        border-left-color: var(--blue);
        color: var(--blue-deep);
      }

      .dropdown-item-side:hover {
        background: var(--blue);
        color: white;
      }

      .dropdown-item-side:hover i {
        color: white;
      }

      /* Sidebar Backdrop */
      .sidebar-overlay {
        display: block;
        position: fixed;
        top: 70px;
        left: 0;
        width: 100%;
        height: calc(100vh - 70px);
        background: rgba(15, 23, 42, 0.45);
        z-index: 998;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s var(--ease);
      }

      .sidebar-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      /* ----- MAIN PANEL ----- */
      .main-panel {
        padding: 20px 16px;
      }

      .top-row {
        flex-direction: column;
        gap: 20px;
      }

      .profile-sidebar {
        width: 100%;
        border-radius: 4px;
      }

      .welcome-section {
        padding: 24px;
        border-radius: 4px;
      }

      .welcome-title {
        font-size: 22px;
      }

      .welcome-title span {
        color: var(--blue);
      }

      .passport-frame {
        width: 120px;
        height: 150px;
        margin: 0 auto 16px;
        border: 4px solid var(--blue);
        border-radius: 4px;
      }
    }

    /* ========== TABLET (769px - 1024px) ========== */
    @media (min-width: 769px) and (max-width: 1024px) {
      
      .school-name {
        font-family: 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif;
        font-weight: 900;
        font-style: italic;
        letter-spacing: 0.5px;
        color: var(--blue-deep, #1e3a8a);
        font-size: 18px;
        max-width: 250px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .datetime-display {
        padding: 4px 12px;
        gap: 10px;
        border-radius: 4px;
      }

      .date-text, 
      .time-text {
        font-size: 12px;
      }

      .date-box i, 
      .time-box i {
        color: var(--blue);
      }

      .top-row {
        gap: 20px;
      }

      .welcome-section {
        padding: 28px;
        border-radius: 4px;
      }

      .profile-sidebar {
        width: 240px;
        border-radius: 4px;
      }

      .passport-frame {
        border: 4px solid var(--blue);
        border-radius: 4px;
      }

      .icon-btn:hover {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }

      .nav-link:hover {
        background: var(--blue-soft);
        color: var(--blue-deep);
        border-left-color: var(--blue);
      }

      .nav-link:hover i {
        color: var(--blue-deep);
      }

      .dropdown-toggle:hover {
        background: var(--blue-soft);
        border-left-color: var(--blue);
        color: var(--blue-deep);
      }

      .dropdown-item-side:hover {
        background: var(--blue);
        color: white;
      }

      .dropdown-item-side:hover i {
        color: white;
      }
    }

    /* ========== SMALL PHONES (max-width: 400px) ========== */
    @media (max-width: 400px) {
      
      .school-name {
        font-family: 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif;
        font-weight: 900;
        font-style: italic;
        letter-spacing: 0.4px;
        color: var(--blue-deep, #1e3a8a);
        font-size: 12px;
        line-height: 1.25;
        white-space: normal;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        font-size: 15px;
        border-radius: 4px;
      }

      .main-panel {
        padding: 16px 12px;
      }

      .welcome-title {
        font-size: 20px;
      }

      .welcome-title span {
        color: var(--blue);
      }

      .welcome-section {
        padding: 16px;
        border-radius: 4px;
      }

      .passport-frame {
        width: 100px;
        height: 125px;
        border: 4px solid var(--blue);
        border-radius: 4px;
      }

      .profile-name {
        font-size: 18px;
      }

      .section-header {
        font-size: 11px;
        color: var(--ink-soft);
      }

      .nav-link {
        font-size: 13.5px;
        padding: 11px 16px;
      }

      .nav-link i {
        color: var(--blue);
      }

      .nav-link:hover {
        background: var(--blue-soft);
        color: var(--blue-deep);
        border-left-color: var(--blue);
      }

      .nav-link:hover i {
        color: var(--blue-deep);
      }
    }

    /* ========== DESKTOP (1025px+) ========== */
    @media (min-width: 1025px) {
      
      /* Hide overlay completely on desktop */
      .sidebar-overlay {
        display: none !important;
      }

      /* Sidebar stays visible and sticky */
      .side-nav {
        position: sticky;
      }
    }

    /* ===== Page-specific styles (previously style.css) ===== */
    .page-header {
      margin-bottom: 24px;
    }
    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #0f172a;
      letter-spacing: -0.3px;
    }
    .page-header p {
      color: #475569;
      font-size: 15px;
      margin-top: 4px;
    }

    /* Card */
    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      border: 1px solid #e9eef3;
      margin-bottom: 24px;
      transition: box-shadow 0.2s;
    }
    .card:hover {
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: #1e293b;
      letter-spacing: -0.2px;
    }
    .card-title i {
      color: #2563eb;
      font-size: 18px;
      width: 22px;
      text-align: center;
    }

    /* Date grid */
    .date-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-group label i {
      color: #64748b;
      font-size: 13px;
      width: 16px;
    }
    .form-group label .req {
      color: #dc2626;
      font-weight: 700;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      background: #ffffff;
      transition: 0.2s;
      outline: none;
      color: #0f172a;
    }
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .form-control:disabled {
      background: #f8fafc;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Buttons */
    .btn-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: 0.18s;
      text-decoration: none;
      white-space: nowrap;
      line-height: 1.4;
    }
    .btn i {
      font-size: 15px;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.30);
    }

    .btn-secondary {
      background: #ffffff;
      color: #1e293b;
      border-color: #e2e8f0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .btn-secondary:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    /* Teacher count badge */
    #teacherCountBadge {
      background: #eff6ff;
      color: #2563eb;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 11px;
      margin-left: 8px;
      border: 1px solid #dbeafe;
      border-radius: 30px;
    }

    /* ===== Student / Teacher rows ===== */
    .student-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 12px;
      border-radius: 14px;
      background: #ffffff;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
      flex-wrap: wrap;
    }
    .student-row:last-child {
      border-bottom: none;
    }
    .student-row:hover {
      background: #f8fafc;
    }

    .student-photo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #64748b;
      flex-shrink: 0;
      border: 2px solid #e9eef3;
      overflow: hidden;
    }
    .student-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .student-photo i {
      font-size: 22px;
      color: #64748b;
    }

    .student-main {
      flex: 1;
      min-width: 180px;
    }
    .s-name {
      font-weight: 700;
      font-size: 15px;
      color: #0f172a;
      margin-bottom: 2px;
    }
    .s-reg {
      font-size: 13px;
      color: #64748b;
    }

    .s-action {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Action toggle (radio group) */
    .action-toggle {
      display: flex;
      gap: 4px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      flex-wrap: wrap;
    }
    .action-toggle input[type="radio"] {
      display: none;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: 0.15s;
      background: transparent;
      color: #475569;
      user-select: none;
      line-height: 1.3;
      white-space: nowrap;
    }
    .action-btn i {
      font-size: 13px;
    }
    .action-btn:hover {
      background: rgba(255,255,255,0.7);
    }

    /* Present */
    .action-btn.present i { color: #16a34a; }
    input[type="radio"]:checked + .action-btn.present {
      background: #16a34a;
      color: #fff;
      border-color: #16a34a;
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.25);
    }
    input[type="radio"]:checked + .action-btn.present i { color: #fff; }

    /* Absent */
    .action-btn.absent i { color: #dc2626; }
    input[type="radio"]:checked + .action-btn.absent {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.25);
    }
    input[type="radio"]:checked + .action-btn.absent i { color: #fff; }

    /* Leave */
    .action-btn.leave i { color: #f59e0b; }
    input[type="radio"]:checked + .action-btn.leave {
      background: #f59e0b;
      color: #fff;
      border-color: #f59e0b;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
    }
    input[type="radio"]:checked + .action-btn.leave i { color: #fff; }

    /* Save row */
    .save-row {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
    }
    .save-row .btn-primary {
      padding: 12px 32px;
      font-size: 15px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
    }
    .empty-state i {
      font-size: 40px;
      margin-bottom: 12px;
      color: #cbd5e1;
      display: block;
    }
    .empty-state p {
      font-size: 15px;
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 12px 26px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 12px 32px rgba(0,0,0,0.18);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeInUp 0.3s ease;
      max-width: 90vw;
    }
    .toast-msg i {
      color: #60a5fa;
      font-size: 16px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* Responsive adjustments for page-specific content */
    @media (max-width: 900px) {
      .date-grid {
        grid-template-columns: 1fr;
      }
      .student-row {
        flex-wrap: wrap;
        gap: 10px;
      }
      .s-action {
        width: 100%;
        justify-content: flex-start;
      }
      .action-toggle {
        flex: 1;
        justify-content: stretch;
      }
      .action-btn {
        flex: 1;
        justify-content: center;
        padding: 8px 10px;
        font-size: 12px;
      }
    }

    @media (max-width: 600px) {
      .app-wrapper {
        flex-direction: column;
        gap: 0;
      }
      .main-panel {
        padding: 12px 0 30px;
      }
      .card {
        padding: 16px;
        border-radius: 14px;
      }
      .page-header h1 {
        font-size: 22px;
      }
      .btn-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-actions .btn {
        width: 100%;
        justify-content: center;
      }
      .student-photo {
        width: 44px;
        height: 44px;
        font-size: 18px;
      }
      .s-name {
        font-size: 14px;
      }
      .action-btn {
        font-size: 11px;
        padding: 6px 8px;
        gap: 4px;
      }
      .action-btn i {
        font-size: 11px;
      }
      .save-row {
        justify-content: stretch;
      }
      .save-row .btn-primary {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-user-check" style="color:#2563eb;"></i> Teacher Attendance</h1>
        <p>Mark daily attendance for all teachers</p>
      </div>

      <!-- Date Selection -->
      <div class="card">
        <div class="card-title">
          <i class="fas fa-calendar-day"></i> Select Date
        </div>
        <div class="date-grid">
          <div class="form-group">
            <label><i class="fas fa-calendar"></i> Attendance Date <span class="req">*</span></label>
            <input type="date" class="form-control" id="attendanceDate" onchange="loadTeachersForDate()">
          </div>
          <div class="form-group">
            <label><i class="fas fa-info-circle"></i> Status</label>
            <input type="text" class="form-control" id="dateStatus" disabled placeholder="Loading...">
          </div>
        </div>
        <div class="btn-actions" style="margin-top:12px;">
          <button type="button" class="btn btn-secondary" onclick="markAllPresent()">
            <i class="fas fa-check-double"></i> Mark All Present
          </button>
          <button type="button" class="btn btn-secondary" onclick="clearAllMarks()">
            <i class="fas fa-eraser"></i> Clear All
          </button>
          <a href="teacher-attendance-details.html" class="btn btn-secondary">
            <i class="fas fa-eye"></i> View History
          </a>
        </div>
      </div>

      <!-- Teacher List -->
      <div class="card">
        <div class="card-title">
          <i class="fas fa-users"></i> Teachers
          <span id="teacherCountBadge" style="background:#eff6ff;color:#2563eb;font-size:13px;font-weight:700;padding:3px 11px;margin-left:8px;border:1px solid #dbeafe;">0</span>
        </div>
        <div id="teacherListContainer"></div>

        <div class="save-row" id="saveRow" style="display:none;">
          <button type="button" class="btn btn-primary" onclick="saveTeacherAttendance()">
            <i class="fas fa-save"></i> Save Attendance
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="../components.js"></script>
  <script>
    function loadComponents() {
      fetch('header.html').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);
      fetch('sidebar.html').then(r => r.text()).then(d => document.getElementById('sidebar-placeholder').innerHTML = d);
    }

    window.onload = function() {
      loadComponents();
      setTimeout(() => { if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar(); }, 400);

      // Default to today
      document.getElementById('attendanceDate').value = new Date().toISOString().split('T')[0];
      loadTeachersForDate();
    };

    // ===== Storage Helpers =====
    function loadFromStorage(key) {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : [];
    }
    function saveToStorage(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }
    function showToast(msg) {
      let t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2400);
    }

    // ===== Load teachers for selected date =====
    function loadTeachersForDate() {
      const date = document.getElementById('attendanceDate').value;
      if (!date) return;

      const teachers = loadFromStorage('messTeachers');
      const existing = loadFromStorage('messTeacherAttendanceRecords')
        .filter(r => r.date === date);

      const container = document.getElementById('teacherListContainer');
      const badge = document.getElementById('teacherCountBadge');
      const statusField = document.getElementById('dateStatus');
      const saveRow = document.getElementById('saveRow');

      badge.textContent = teachers.length;

      if (teachers.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No teachers enrolled yet.</p></div>`;
        statusField.value = 'No teachers';
        saveRow.style.display = 'none';
        return;
      }

      const markedCount = existing.length;
      statusField.value = markedCount === 0
        ? 'Not marked yet'
        : markedCount === teachers.length
          ? '✅ Fully marked'
          : `⚠️ Partially marked (${markedCount}/${teachers.length})`;

      container.innerHTML = teachers.map(t => {
        const rec = existing.find(r => r.teacherRegNo === t.regNo);
        const status = rec ? rec.status : 'Present';
        const photoHtml = t.photoUrl
          ? `<img class="student-photo" src="${t.photoUrl}" alt="${t.teacherName}">`
          : `<div class="student-photo"><i class="fas fa-user-tie"></i></div>`;

        return `
          <div class="student-row" data-regno="${t.regNo}" data-name="${t.teacherName}">
            ${photoHtml}
            <div class="student-main">
              <div class="s-name">${t.teacherName}</div>
              <div class="s-reg">Reg No: ${t.regNo} · ${t.designation || 'Teacher'}</div>
            </div>
            <div class="s-action">
              <div class="action-toggle">
                <input type="radio" name="tatt_${t.regNo}" id="tatt_${t.regNo}_present"
                  ${status === 'Present' ? 'checked' : ''} value="Present">
                <label for="tatt_${t.regNo}_present" class="action-btn present">
                  <i class="fas fa-check"></i>Present
                </label>
                <input type="radio" name="tatt_${t.regNo}" id="tatt_${t.regNo}_absent"
                  ${status === 'Absent' ? 'checked' : ''} value="Absent">
                <label for="tatt_${t.regNo}_absent" class="action-btn absent">
                  <i class="fas fa-times"></i>Absent
                </label>
                <input type="radio" name="tatt_${t.regNo}" id="tatt_${t.regNo}_leave"
                  ${status === 'Leave' ? 'checked' : ''} value="Leave">
                <label for="tatt_${t.regNo}_leave" class="action-btn leave">
                  <i class="fas fa-plane"></i>Leave
                </label>
              </div>
            </div>
          </div>
        `;
      }).join('');

      saveRow.style.display = 'block';
    }

    // ===== Bulk actions =====
    function markAllPresent() {
      document.querySelectorAll('#teacherListContainer .student-row').forEach(row => {
        const regNo = row.dataset.regno;
        const radio = document.getElementById(`tatt_${regNo}_present`);
        if (radio) radio.checked = true;
      });
    }

    function clearAllMarks() {
      // Reset all to unselected (so admin can re-pick); or default to Present
      document.querySelectorAll('#teacherListContainer .student-row').forEach(row => {
        const regNo = row.dataset.regno;
        const radio = document.getElementById(`tatt_${regNo}_present`);
        if (radio) radio.checked = true;
      });
    }

    // ===== Save =====
    function saveTeacherAttendance() {
      const date = document.getElementById('attendanceDate').value;
      const session = JSON.parse(localStorage.getItem('messCurrentUser'));
      const rows = document.querySelectorAll('#teacherListContainer .student-row');
      const timestamp = Date.now();

      if (rows.length === 0) {
        showToast('⚠️ No teachers to mark');
        return;
      }

      // Remove existing records for this date (idempotent save)
      let records = loadFromStorage('messTeacherAttendanceRecords')
        .filter(r => r.date !== date);

      rows.forEach(row => {
        const regNo = row.dataset.regno;
        const teacherName = row.dataset.name;
        const checked = row.querySelector('input[type="radio"]:checked');
        const status = checked ? checked.value : 'Present';

        records.push({
          id: 'TATT-' + timestamp + '-' + Math.floor(Math.random() * 10000),
          teacherRegNo: regNo,
          teacherName: teacherName,
          date: date,
          status: status,
          markedByRegNo: session.regNo,
          markedByName: session.name,
          lastMarkedTime: timestamp
        });
      });

      saveToStorage('messTeacherAttendanceRecords', records);
      showToast(`✅ Attendance saved for ${date}`);
      loadTeachersForDate();
    }
  </script>
</body>
</html>
